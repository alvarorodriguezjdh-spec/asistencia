<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registro de asistencia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#23272B">
<link rel="icon" id="favicon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --asfalto: #23272B; --asfalto-2: #3A4046; --concreto: #ECEEEC; --papel: #FFFFFF; --linea: #D6DAD6;
    --texto: #23272B; --tenue: #5F676E; --amarillo: #F2B705; --rojo: #C8372D; --verde: #2E7D4F; --naranja: #C46A12;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--concreto); color: var(--texto); font: 16px/1.4 'Barlow', system-ui, sans-serif; min-height: 100%; }
  button, select, input { font: inherit; color: inherit; }
  .top { background: var(--asfalto); color: #fff; padding: 12px 16px 10px; border-bottom: 4px solid var(--amarillo); display: flex; align-items: center; gap: 10px; }
  .top img { height: 28px; width: auto; border-radius: 4px; background: #fff; padding: 2px; }
  .top .m { font: 700 16px 'Barlow Condensed', sans-serif; letter-spacing: .05em; flex: 1; }
  .top .r { font-size: 13px; color: #c9cdd1; }
  main { max-width: 460px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: calc(100vh - 56px); min-height: calc(100dvh - 56px); }
  .hola { font: 600 26px/1.1 'Barlow Condensed', sans-serif; margin: 0; }
  .sub { color: var(--tenue); font-size: 14px; margin: 0; }
  .card { background: var(--papel); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; }
  .estado { border-left: 5px solid var(--tenue); }
  .estado .e { font: 700 20px 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .03em; }
  .estado.trab { border-left-color: var(--verde); } .estado.trab .e { color: var(--verde); }
  .estado.desc { border-left-color: var(--naranja); } .estado.desc .e { color: var(--naranja); }
  .ubi { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .pt { width: 11px; height: 11px; border-radius: 50%; flex: none; background: #b8bdb8; }
  .pt.si { background: var(--verde); } .pt.lejos { background: var(--rojo); } .pt.libre { background: var(--amarillo); }
  .reloj { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 110px; }
  .reloj b { font: 700 54px/1 'Barlow Condensed', sans-serif; }
  .btn { border: 0; border-radius: 12px; padding: 18px 10px; font: 700 24px 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; width: 100%; cursor: pointer; }
  .btn:active { transform: scale(.99); }
  .btn[disabled] { background: #c9ccc9 !important; color: #7b8288 !important; border-color: #c9ccc9 !important; cursor: default; }
  .b-am { background: var(--amarillo); color: var(--asfalto); }
  .b-os { background: var(--asfalto); color: #fff; }
  .b-bl { background: #fff; color: var(--asfalto); border: 2px solid var(--asfalto); }
  .b-peq { font-size: 17px; padding: 12px; }
  .enlace { background: none; border: 0; color: var(--asfalto-2); text-decoration: underline; font-size: 14px; padding: 8px; cursor: pointer; }
  .mini { font-size: 13px; color: var(--tenue); text-align: center; margin: 0; }
  label { display: block; font-size: 13px; color: var(--tenue); margin-bottom: 4px; }
  input, select { width: 100%; background: #fff; border: 1px solid var(--linea); border-radius: 8px; padding: 13px 12px; font-size: 18px; }
  input:focus, select:focus { outline: 3px solid var(--amarillo); outline-offset: 1px; }
  .alerta { background: #fdecea; border: 1px solid #f1b7b1; color: #8b241c; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .aviso { background: #fff6cc; border: 1px solid #f0d36a; color: #5b4a00; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .barra { height: 8px; background: #dfe2df; border-radius: 4px; overflow: hidden; margin-top: 6px; } .barra i { display: block; height: 100%; background: var(--naranja); }
  .ok { width: 86px; height: 86px; border-radius: 50%; background: var(--verde); color: #fff; display: grid; place-items: center; margin: 20px auto 4px; }
  .res { width: 100%; border-collapse: collapse; } .res td { padding: 5px 0; font-size: 15px; } .res td:last-child { text-align: right; font-weight: 600; }
  .centro { text-align: center; }
  .spin { width: 34px; height: 34px; border: 4px solid #cfd3cf; border-top-color: var(--asfalto); border-radius: 50%; animation: g 1s linear infinite; margin: 40px auto 10px; }
  @keyframes g { to { transform: rotate(360deg); } }
  .confirmar { display: flex; gap: 10px; } .confirmar .btn { font-size: 20px; }
  .op { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; padding: 12px; font-weight: 600; font-size: 16px; text-align: left; width: 100%; cursor: pointer; }
  .op i { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 18px; flex: none; }
  .op small { display: block; font-weight: 400; color: var(--tenue); font-size: 12px; }
  .firma { position: relative; background: #fff; border: 1px dashed #9aa19a; border-radius: 8px; height: 150px; touch-action: none; }
  .firma canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .firma .pie { position: absolute; left: 10px; right: 10px; bottom: 6px; display: flex; justify-content: space-between; font-size: 12px; color: var(--tenue); pointer-events: none; }
  .firma .pie button { pointer-events: auto; background: none; border: 0; color: var(--asfalto-2); text-decoration: underline; font-size: 12px; padding: 0; }
  .fila2 { display: flex; gap: 8px; } .fila2 > div { flex: 1; }
  .step { display: flex; align-items: center; border: 1px solid var(--linea); border-radius: 8px; background: #fff; overflow: hidden; }
  .step b { flex: 1; text-align: center; font-size: 20px; } .step button { width: 46px; font-size: 22px; padding: 9px 0; background: #f2f3f2; border: 0; }
  .seg { display: flex; border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; } .seg button { flex: 1; border: 0; background: #fff; padding: 11px; font-size: 15px; }
  .seg button.on { background: var(--asfalto); color: #fff; }
  .adj { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--linea); border-radius: 8px; padding: 8px; }
  .adj img { width: 60px; height: 72px; object-fit: cover; border-radius: 4px; background: #e9ecef; }
  .est-PENDIENTE { color: var(--naranja); } .est-APROBADA { color: var(--verde); } .est-RECHAZADA { color: var(--rojo); }
  .oculto { display: none !important; }
</style>
</head>
<body>
<div class="top">
  <img id="logo" alt="" hidden>
  <span class="m">REGISTRO DE ASISTENCIA</span><span class="r" id="tFecha"></span>
</div>
<main id="app"><div class="spin"></div><p class="mini">Cargando…</p></main>

<script>
/* ↓↓↓ Pega aquí el link de la app web (el que termina en /exec) ↓↓↓ */
var API = 'https://script.google.com/macros/s/AKfycbz0XnMR1yQgZJKFNJbvTFlaEJ8rAflT03hU5iVhbDBwgGWDr89cQmA4Xd78oc-rEwSp/exec';
/* ↑↑↑ ---------------------------------------------------------- ↑↑↑ */
var $app = document.getElementById('app');
var E = null, POS = null, POS_ERR = '', T0 = Date.now(), timer = null, volver = null, pidiendoSalida = false, RUTA = '';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function q(id) { return document.getElementById(id); }

/* ---- identificador del celular ---- */
function devId() {
  var k = 'asistencia_dispositivo', v = null;
  try { v = localStorage.getItem(k); } catch (e) { }
  if (!v) {
    var a = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(a);
    v = Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    try { localStorage.setItem(k, v); } catch (e) { }
  }
  return v;
}
function guardaDisponible() { try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); return true; } catch (e) { return false; } }
var DEV = devId();

function llamar(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('Sin conexión con el servidor (' + r.status + ')'); return r.json(); })
    .catch(function (e) { throw new Error(e && e.message && e.message.indexOf('servidor') >= 0 ? e.message : 'No hay conexión. Revisa tus datos o el wifi e intenta de nuevo.'); })
    .then(function (x) {
      if (x.logo && !q('logo').src) { q('logo').src = x.logo; q('logo').hidden = false; q('favicon').href = x.logo; }
      if (!x.ok) throw new Error(x.error);
      return x.r;
    });
}

/* ---- ubicación ---- */
function pedirUbicacion(cb) {
  if (!navigator.geolocation) { POS_ERR = 'Este navegador no permite leer la ubicación.'; cb && cb(); return; }
  navigator.geolocation.getCurrentPosition(function (p) {
    POS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() }; POS_ERR = ''; cb && cb();
  }, function (err) {
    POS_ERR = err.code === 1 ? 'Diste "no permitir" a la ubicación. Actívala en la configuración del navegador para este sitio.' : 'No pudimos leer tu ubicación. Revisa que el GPS esté encendido.';
    cb && cb();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 20000 });
}
function distancia(a, b, c, d) {
  var R = 6371000, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) * Math.sin(y / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function txtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(m) + ' m'; }
function infoUbicacion() {
  var s = E.sede || {}, libre = E.modo === 'LIBRE';
  if (!POS) return { cls: '', txt: POS_ERR ? '<b>Sin ubicación</b>' : 'Buscando tu ubicación…', puede: libre || (s.lat == null), err: POS_ERR };
  if (s.lat == null) return { cls: 'si', txt: '<b>Ubicación leída</b>', puede: true };
  var d = distancia(POS.lat, POS.lng, s.lat, s.lng), holg = Math.min(POS.acc || 0, 100), dentro = d - holg <= (s.radio || 200);
  if (dentro) return { cls: 'si', txt: '<b>En bodega ' + esc(s.nombre ? cap(s.nombre) : '') + '</b> · a ' + txtDist(d), puede: true };
  if (libre) return { cls: 'libre', txt: '<b>Fuera de la bodega</b> · a ' + txtDist(d) + '<br><span class="sub">Se registra la ubicación. Puedes marcar.</span>', puede: true };
  return { cls: 'lejos', txt: '<b>Fuera de la bodega</b> · a ' + txtDist(d), puede: false, err: 'Para marcar debes estar en la bodega (radio de ' + (s.radio || 200) + ' m). Si ya estás aquí, espera unos segundos y toca <b>Actualizar ubicación</b>.' };
}
function cap(s) { s = String(s || '').toLowerCase(); return s.replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }); }

/* ---- reloj ---- */
function horaAhora() { var d = new Date(), h = d.getHours(), m = ('0' + d.getMinutes()).slice(-2); return { h: (h % 12 || 12) + ':' + m, ap: h < 12 ? 'a. m.' : 'p. m.' }; }
function minutosDesde() { return E && E.desdeLm != null ? (E.ahoraLm - E.desdeLm) + (Date.now() - T0) / 60000 : 0; }
function hm(min) { min = Math.max(0, Math.floor(min)); return Math.floor(min / 60) + ':' + ('0' + (min % 60)).slice(-2); }
function tic() {
  var r = horaAhora(); if (q('rH')) { q('rH').textContent = r.h; q('rAp').textContent = r.ap; }
  if (E && E.estado === 'DESCANSO' && q('dLleva')) {
    var l = minutosDesde(), p = E.descPactado || 66;
    q('dLleva').textContent = hm(l); q('dBarra').style.width = Math.min(100, l / p * 100) + '%';
    q('dBarra').style.background = l > p ? 'var(--rojo)' : 'var(--naranja)';
    var falta = p - l;
    q('dAviso').className = falta < 0 ? 'alerta' : 'aviso';
    q('dAviso').textContent = falta < 0 ? 'Te pasaste ' + hm(-falta) + ' del almuerzo.' : 'Te quedan ' + Math.ceil(falta) + ' minutos de almuerzo.';
  }
  if (E && E.estado === 'TRABAJANDO' && q('tLleva')) q('tLleva').textContent = hm(minutosDesde());
}

/* ---- pantallas ---- */
function cargar() {
  $app.innerHTML = '<div class="spin"></div><p class="mini">Cargando…</p>';
  llamar('mk_estado', DEV).then(mostrar).catch(function (e) { error(e.message); });
}
function mostrar(r) {
  T0 = Date.now(); E = r; pidiendoSalida = false;
  if (r.hoy) q('tFecha').textContent = r.hoy;
  if (r.confirmacion) return confirmacion(r);
  if (!r.registrado) return r.pendiente ? pendiente(r) : registro(r);
  principal();
  pedirUbicacion(principal);
}
function error(msg) {
  $app.innerHTML = '<div class="alerta">' + esc(msg) + '</div><button class="btn b-bl b-peq" onclick="cargar()">Intentar de nuevo</button>';
}
function registro(r) {
  var sinGuardar = !guardaDisponible();
  $app.innerHTML =
    '<div><h1 class="hola">Registra este celular</h1><p class="sub">Solo se hace una vez. Desde aquí marcarás todos los días.</p></div>' +
    (r.inactivo ? '<div class="aviso">Este celular ya no está habilitado. Vuelve a registrarlo con tu cédula y PIN.</div>' : '') +
    (sinGuardar ? '<div class="alerta">Este navegador no deja guardar datos (¿modo incógnito o privado?). Abre el link en el navegador normal.</div>' : '') +
    '<div><label for="fCed">Cédula</label><input id="fCed" inputmode="numeric" autocomplete="off" maxlength="12"></div>' +
    '<div><label for="fPin">PIN (te lo da tu coordinador)</label><input id="fPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></div>' +
    '<div id="fMsg"></div><div style="flex:1"></div>' +
    '<button class="btn b-am" id="bReg">Registrar</button>';
  q('bReg').onclick = function () {
    var b = this; b.disabled = true; b.textContent = 'Registrando…'; q('fMsg').innerHTML = '';
    llamar('mk_registrar', DEV, q('fCed').value, q('fPin').value, navigator.userAgent).then(mostrar).catch(function (e) {
      b.disabled = false; b.textContent = 'Registrar'; q('fMsg').innerHTML = '<div class="alerta">' + esc(e.message) + '</div>';
    });
  };
}
function pendiente(r) {
  $app.innerHTML = '<div><h1 class="hola">Celular pendiente de aprobación</h1></div>' +
    '<div class="aviso">' + (r.nombre ? esc(cap(r.nombre)) + ', ya' : 'Ya') + ' tienes otro celular registrado. Tu coordinador debe aprobar este nuevo celular. Cuando lo apruebe, vuelve a abrir este link.</div>' +
    '<div style="flex:1"></div><button class="btn b-bl b-peq" onclick="cargar()">Ya me aprobaron</button>';
}
var ETQ = { 'ENTRADA': 'Marcar entrada', 'SALIDA': 'Marcar salida', 'INICIO DESCANSO': 'Salir a almorzar', 'FIN DESCANSO': 'Volver del almuerzo' };
var CLS = { 'ENTRADA': 'b-am', 'SALIDA': 'b-os', 'INICIO DESCANSO': 'b-bl', 'FIN DESCANSO': 'b-am' };
function principal() {
  if (!E || !E.registrado || E.confirmacion) return;
  var u = infoUbicacion(), est = E.estado;
  var cab = '<div><h1 class="hola">Hola, ' + esc(cap(E.nombreCorto)) + '</h1><p class="sub">' + esc(cap(E.cargo || E.area || '')) + '</p></div>';
  var tarjeta = est === 'TRABAJANDO'
    ? '<div class="card estado trab"><p class="sub">Estado</p><div class="e">Trabajando</div><p class="sub">Desde ' + esc(E.desde) + ' · lleva <span id="tLleva"></span> h</p></div>'
    : est === 'DESCANSO'
      ? '<div class="card estado desc"><p class="sub">Estado</p><div class="e">En almuerzo</div><p class="sub">Desde ' + esc(E.desde) + ' · lleva <b id="dLleva"></b> de ' + hm(E.descPactado || 66) + '</p><div class="barra"><i id="dBarra"></i></div></div><div id="dAviso" class="aviso"></div>'
      : '<div class="card estado"><p class="sub">Estado</p><div class="e">Fuera de turno</div>' + (E.ultimaSalida ? '<p class="sub">Última salida: ' + esc(E.ultimaSalida) + '</p>' : '') + '</div>';
  var ubi = '<div class="card ubi"><span class="pt ' + u.cls + '"></span><span>' + u.txt + '</span></div>' + (u.err ? '<div class="alerta">' + u.err + '</div>' : '');
  var aviso = E.aviso ? '<div class="aviso">' + esc(E.aviso) + '</div>' : '';
  var ruta = '';
  if (E.rutas && E.rutas.length && E.botones.indexOf('ENTRADA') >= 0) {
    ruta = '<div><label for="fRuta">Ruta de hoy</label><select id="fRuta"><option value="">Escoge la ruta…</option>' +
      E.rutas.map(function (x) { return '<option' + (x === RUTA ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '<option>OTRA / APOYO</option></select></div>';
  }
  var botones;
  if (pidiendoSalida) {
    botones = '<div class="aviso">¿Seguro que vas a <b>terminar tu turno</b>?</div><div class="confirmar"><button class="btn b-bl" id="bNo">No</button><button class="btn b-os" id="bSi">Sí, salida</button></div>';
  } else {
    botones = E.botones.map(function (a) { return '<button class="btn ' + CLS[a] + '" data-a="' + a + '"' + (u.puede ? '' : ' disabled') + '>' + ETQ[a] + '</button>'; }).join('');
    if (!u.puede || (!POS && E.modo !== 'LIBRE')) botones += '<button class="btn b-bl b-peq" id="bUbi">Actualizar ubicación</button>';
  }
  $app.innerHTML = cab + tarjeta + ubi + aviso + ruta +
    '<div class="reloj"><b id="rH"></b><span class="sub" id="rAp"></span></div><div id="mMsg"></div>' + botones +
    '<p class="sub centro" style="margin-top:8px">Registrar novedad</p>' +
    '<button class="op" data-nv="COMPENSATORIO"><i style="background:#e8f1ec;color:var(--verde)">↺</i><span>Día compensatorio<small>Con tu firma</small></span></button>' +
    '<button class="op" data-nv="INCAPACIDAD"><i style="background:#fdecea;color:var(--rojo)">✚</i><span>Incapacidad<small>Adjunta la foto</small></span></button>' +
    '<button class="op" data-nv="PERMISO"><i style="background:#eef2f7;color:#2F5D8A">✎</i><span>Permiso<small>Horas o día completo</small></span></button>' +
    '<button class="enlace" id="bMias">Mis novedades</button>' +
    (E.supervisor ? '<button class="enlace" id="bSup">Marcar por otra persona</button>' : '');
  if (q('fRuta')) q('fRuta').onchange = function () { RUTA = this.value; };
  Array.prototype.forEach.call($app.querySelectorAll('[data-a]'), function (b) { b.onclick = function () { accion(b.dataset.a, b); }; });
  if (q('bUbi')) q('bUbi').onclick = function () { this.disabled = true; this.textContent = 'Buscando…'; pedirUbicacion(principal); };
  if (q('bNo')) q('bNo').onclick = function () { pidiendoSalida = false; principal(); };
  if (q('bSi')) q('bSi').onclick = function () { pidiendoSalida = false; enviar('SALIDA', this); };
  if (q('bSup')) q('bSup').onclick = supervisor;
  Array.prototype.forEach.call($app.querySelectorAll('[data-nv]'), function (b) { b.onclick = function () { novedad(b.dataset.nv); }; });
  if (q('bMias')) q('bMias').onclick = function () { novedad('MIAS'); };
  tic(); clearInterval(timer); timer = setInterval(tic, 15000);
}
function accion(a, b) {
  if (a === 'SALIDA') { pidiendoSalida = true; principal(); return; }
  if (a === 'ENTRADA' && q('fRuta') && !q('fRuta').value) { q('mMsg').innerHTML = '<div class="alerta">Escoge la ruta de hoy.</div>'; return; }
  enviar(a, b);
}
function enviar(a, b) {
  Array.prototype.forEach.call($app.querySelectorAll('button'), function (x) { x.disabled = true; });
  b.textContent = 'Registrando…';
  var go = function () {
    llamar('mk_marcar', DEV, a, POS, RUTA).then(function (r) {
      if (r && r.error === 'UBICACION') { principal(); q('mMsg').innerHTML = '<div class="alerta">' + esc(r.msg) + '</div>'; return; }
      mostrar(r);
    }).catch(function (e) { principal(); q('mMsg').innerHTML = '<div class="alerta">' + esc(e.message) + '</div>'; });
  };
  // ubicación fresca (máx. 1 minuto)
  if (!POS || Date.now() - POS.t > 60000) pedirUbicacion(go); else go();
}
function confirmacion(r) {
  var c = r.confirmacion;
  $app.innerHTML = '<div class="centro"><div class="ok"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>' +
    '<h1 class="hola">' + esc(c.accion) + ' registrada</h1><div class="reloj" style="min-height:70px"><b style="font-size:42px">' + esc(c.hora) + '</b></div></div>' +
    (c.resumen && c.resumen.length ? '<div class="card"><table class="res">' + c.resumen.map(function (x) { return '<tr><td>' + esc(x.k) + '</td><td>' + esc(x.v) + '</td></tr>'; }).join('') + '</table></div>' : '') +
    '<div style="flex:1"></div><button class="btn b-bl b-peq" id="bListo">Listo</button><p class="mini">Vuelve sola al inicio en 10 segundos</p>';
  var fin = function () { clearTimeout(volver); r.confirmacion = null; mostrar(r); };
  q('bListo').onclick = fin; clearTimeout(volver); volver = setTimeout(fin, 10000);
}


/* ---- novedades ---- */
var NV = null, FIRMA = null;
var NOM_NV = { COMPENSATORIO: 'Día compensatorio', INCAPACIDAD: 'Incapacidad', PERMISO: 'Permiso' };
function isoHoy() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function sumarDias(iso, n) { var d = new Date(Date.parse(iso + 'T12:00:00Z') + n * 864e5); return d.toISOString().slice(0, 10); }
function fechaLarga(iso) { var d = new Date(iso + 'T12:00:00Z'), m = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic']; return ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'][d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + m[d.getUTCMonth()]; }
function novedad(tipo) {
  clearInterval(timer);
  var go = function () { ({ COMPENSATORIO: nvComp, INCAPACIDAD: nvInc, PERMISO: nvPerm, MIAS: nvMias })[tipo](); };
  if (NV) return go();
  $app.innerHTML = '<div class="spin"></div><p class="mini">Cargando…</p>';
  llamar('mk_novedadInfo', DEV).then(function (r) { NV = r; go(); }).catch(function (e) { error(e.message); });
}
function cabNv(t) { return '<div><h1 class="hola">' + t + '</h1><p class="sub">' + esc(cap(NV.nombre)) + ' · ' + esc(cap(NV.area)) + '</p></div>'; }
function pieNv(txtBtn) { return '<div id="nMsg"></div><div style="flex:1"></div><button class="btn b-am" id="nEnviar">' + txtBtn + '</button><button class="enlace" id="nVolver">Volver</button>'; }
function enlazarPie(fn) { q('nVolver').onclick = function () { cargar(); }; q('nEnviar').onclick = fn; }
function msgNv(t) { q('nMsg').innerHTML = t ? '<div class="alerta">' + esc(t) + '</div>' : ''; }
function padFirma() {
  return '<div><label>Tu firma</label><div class="firma"><canvas id="cFirma"></canvas><div class="pie"><span>Firma aquí con el dedo</span><button type="button" id="bBorrar">Borrar</button></div></div></div>';
}
function iniciarFirma() {
  var c = q('cFirma'), r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1, ctx, dib = false, hay = false, ult = null;
  c.width = r.width * k; c.height = r.height * k; ctx = c.getContext('2d'); ctx.scale(k, k);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d2a6b';
  function pos(e) { var b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  c.onpointerdown = function (e) { dib = true; hay = true; ult = pos(e); c.setPointerCapture(e.pointerId); e.preventDefault(); };
  c.onpointermove = function (e) { if (!dib) return; var p = pos(e); ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ult = p; e.preventDefault(); };
  c.onpointerup = c.onpointercancel = function () { dib = false; };
  q('bBorrar').onclick = function () { ctx.clearRect(0, 0, c.width, c.height); hay = false; };
  FIRMA = function () { return hay ? c.toDataURL('image/png') : ''; };
}
function nvComp() {
  $app.innerHTML = cabNv('Día compensatorio') +
    '<div><label for="nF">¿Qué día descansas?</label><input type="date" id="nF" min="' + NV.comp.min + '" max="' + NV.comp.max + '"></div>' +
    '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span class="sub">Horas de tu jornada ese día</span><b id="nH" style="font:700 24px \'Barlow Condensed\',sans-serif">—</b></div>' +
    padFirma() + '<p class="mini" style="text-align:left">Al firmar confirmas que tomas este día como compensatorio por horas extra trabajadas.</p>' + pieNv('Firmar y enviar');
  iniciarFirma();
  q('nF').onchange = function () { var j = NV.jornadas[this.value]; q('nH').textContent = !this.value ? '—' : j ? hm(j) + ' h' : 'Sin jornada'; msgNv(this.value && !j ? 'Ese día no tienes jornada (domingo, festivo o día sin horario).' : ''); };
  enlazarPie(function () {
    var f = q('nF').value;
    if (!f) return msgNv('Escoge el día.');
    if (!NV.jornadas[f]) return msgNv('Ese día no tienes jornada.');
    if (!FIRMA()) return msgNv('Falta tu firma.');
    enviarNv(this, { tipo: 'COMPENSATORIO', fecha: f, firma: FIRMA() });
  });
}
function nvPerm() {
  $app.innerHTML = cabNv('Permiso') +
    '<div><label for="nF">Día del permiso</label><input type="date" id="nF" min="' + NV.perm.min + '" max="' + NV.perm.max + '"></div>' +
    '<div><label for="nMot">Motivo</label><select id="nMot"><option value="">Escoge…</option>' + NV.motivos.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select></div>' +
    '<div class="seg" id="nSeg"><button type="button" class="on" data-c="1">Día completo</button><button type="button" data-c="0">Por horas</button></div>' +
    '<div id="nHorasC" class="oculto"><label for="nHoras">¿Cuántas horas?</label><input id="nHoras" type="number" inputmode="decimal" min="0.5" step="0.5" placeholder="Ej. 2"></div>' +
    padFirma() + pieNv('Firmar y enviar');
  iniciarFirma();
  var completo = true;
  Array.prototype.forEach.call(q('nSeg').children, function (b) { b.onclick = function () { completo = b.dataset.c === '1'; Array.prototype.forEach.call(q('nSeg').children, function (x) { x.className = x === b ? 'on' : ''; }); q('nHorasC').className = completo ? 'oculto' : ''; }; });
  enlazarPie(function () {
    var f = q('nF').value;
    if (!f) return msgNv('Escoge el día.');
    if (!NV.jornadas[f]) return msgNv('Ese día no tienes jornada.');
    if (!q('nMot').value) return msgNv('Escoge el motivo.');
    if (!completo && !(parseFloat(q('nHoras').value) > 0)) return msgNv('Escribe cuántas horas.');
    if (!FIRMA()) return msgNv('Falta tu firma.');
    enviarNv(this, { tipo: 'PERMISO', fecha: f, motivo: q('nMot').value, diaCompleto: completo, horas: q('nHoras').value, firma: FIRMA() });
  });
}
function nvInc() {
  var dias = 1, SOP = null;
  $app.innerHTML = cabNv('Incapacidad') +
    '<div class="fila2"><div><label for="nF">Desde</label><input type="date" id="nF" min="' + NV.inc.min + '" max="' + NV.inc.max + '" value="' + isoHoy() + '"></div>' +
    '<div><label>Días</label><div class="step"><button type="button" id="nMenos">−</button><b id="nDias">1</b><button type="button" id="nMas">+</button></div></div></div>' +
    '<div class="card" id="nCubre"></div>' +
    '<div><label>Foto o PDF de la incapacidad</label><input type="file" id="nArch" accept="image/*,application/pdf" style="font-size:15px;padding:10px"></div><div id="nPrev"></div>' +
    pieNv('Enviar');
  function cubre() {
    var f = q('nF').value; if (!f) { q('nCubre').innerHTML = ''; return; }
    var hab = [], min = 0;
    for (var i = 0; i < dias; i++) { var d = sumarDias(f, i), j = NV.jornadas[d]; if (j) { hab.push(fechaLarga(d)); min += j; } }
    q('nCubre').innerHTML = '<p class="sub">Del ' + fechaLarga(f) + ' al ' + fechaLarga(sumarDias(f, dias - 1)) + '</p><b>' + hab.length + (hab.length === 1 ? ' día' : ' días') + ' de trabajo · ' + hm(min) + ' h de jornada</b>' + (hab.length && hab.length <= 6 ? '<p class="sub">' + hab.join(', ') + '</p>' : '');
  }
  q('nMenos').onclick = function () { dias = Math.max(1, dias - 1); q('nDias').textContent = dias; cubre(); };
  q('nMas').onclick = function () { dias = Math.min(180, dias + 1); q('nDias').textContent = dias; cubre(); };
  q('nF').onchange = cubre; cubre();
  q('nArch').onchange = function () {
    var f = this.files[0]; SOP = null; q('nPrev').innerHTML = ''; if (!f) return;
    leerArchivo(f).then(function (s) { SOP = s; q('nPrev').innerHTML = '<div class="adj">' + (/^data:image/.test(s.data) ? '<img src="' + s.data + '">' : '<span style="font-size:28px">📄</span>') + '<div><b>' + esc(s.nombre) + '</b><p class="sub">' + Math.round(s.data.length * 0.75 / 1024) + ' KB</p></div></div>'; })
      .catch(function (e) { msgNv(e.message); });
  };
  enlazarPie(function () {
    if (!q('nF').value) return msgNv('Escoge la fecha de inicio.');
    if (!SOP) return msgNv('Adjunta la foto de la incapacidad.');
    enviarNv(this, { tipo: 'INCAPACIDAD', desde: q('nF').value, dias: dias, soporte: SOP });
  });
}
// Las fotos se reducen a 1600 px para que suban rápido
function leerArchivo(f) {
  return new Promise(function (ok, mal) {
    var r = new FileReader();
    r.onerror = function () { mal(new Error('No se pudo leer el archivo')); };
    r.onload = function () {
      var url = r.result;
      if (!/^data:image/.test(url)) { if (url.length > 8e6) return mal(new Error('El archivo es muy pesado (máx. 6 MB).')); return ok({ data: url, nombre: f.name }); }
      var im = new Image();
      im.onload = function () {
        var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        ok({ data: c.toDataURL('image/jpeg', 0.75), nombre: f.name.replace(/\.[^.]+$/, '') + '.jpg' });
      };
      im.onerror = function () { ok({ data: url, nombre: f.name }); };
      im.src = url;
    };
    r.readAsDataURL(f);
  });
}
function enviarNv(b, datos) {
  b.disabled = true; b.textContent = 'Enviando…'; msgNv('');
  llamar('mk_crearSolicitud', DEV, datos).then(function (r) {
    NV.mias = r.mias;
    $app.innerHTML = '<div class="centro"><div class="ok" style="background:var(--naranja)"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h1 class="hola">Enviado</h1><p class="sub" style="margin-top:6px">' + esc(r.msg) + '</p></div>' +
      tablaMias() + '<div style="flex:1"></div><button class="btn b-bl b-peq" id="nListo">Volver</button>';
    q('nListo').onclick = function () { cargar(); };
  }).catch(function (e) { b.disabled = false; b.textContent = 'Enviar'; msgNv(e.message); });
}
function tablaMias() {
  if (!NV.mias || !NV.mias.length) return '<p class="mini">Todavía no tienes novedades registradas.</p>';
  return '<div class="card"><p class="sub">Mis novedades</p><table class="res">' + NV.mias.map(function (m) {
    var f = m.desde === m.hasta ? fechaLarga(m.desde) : fechaLarga(m.desde) + ' – ' + fechaLarga(m.hasta);
    return '<tr><td>' + esc(cap(m.tipo)) + ' · ' + f + '</td><td class="est-' + m.estado + '">' + esc(cap(m.estado)) + '</td></tr>';
  }).join('') + '</table></div>';
}
function nvMias() {
  $app.innerHTML = '<div><h1 class="hola">Mis novedades</h1></div>' + tablaMias() + '<div style="flex:1"></div><button class="btn b-bl b-peq" id="nListo">Volver</button>';
  q('nListo').onclick = function () { cargar(); };
}

/* ---- supervisor ---- */
var SUP = null;
function supervisor() {
  clearInterval(timer);
  $app.innerHTML = '<div class="spin"></div><p class="mini">Cargando personal…</p>';
  llamar('mk_listaPersonal', DEV).then(function (r) { SUP = r; pintarSup(); }).catch(function (e) { error(e.message); });
}
var NOM_EST = { FUERA: 'Fuera de turno', TRABAJANDO: 'Trabajando', DESCANSO: 'En almuerzo' };
function pintarSup(msg) {
  var sel = q('sPer') ? q('sPer').value : '';
  $app.innerHTML = '<div><h1 class="hola">Marcar por otra persona</h1><p class="sub">Queda como marcación manual y aparece en Alertas.</p></div>' + (msg || '') +
    '<div><label for="sPer">Persona</label><select id="sPer"><option value="">Escoge…</option>' + SUP.lista.map(function (p) { return '<option value="' + esc(p.cedula) + '"' + (p.cedula === sel ? ' selected' : '') + '>' + esc(p.nombre) + ' · ' + NOM_EST[p.estado] + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="sMot">Motivo</label><select id="sMot"><option value="">Escoge…</option>' + SUP.motivos.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</select></div>' +
    '<div><label for="sHora">Hora real (déjala vacía si es ahora)</label><input id="sHora" type="time"></div>' +
    '<div id="sRutaC"></div><div id="sMsg"></div><div style="flex:1"></div><div id="sBot"></div>' +
    '<button class="enlace" id="sVolver">Volver a mi registro</button>';
  q('sVolver').onclick = cargar;
  q('sPer').onchange = botSup; botSup();
}
function botSup() {
  var p = SUP.lista.filter(function (x) { return x.cedula === q('sPer').value; })[0];
  q('sRutaC').innerHTML = p && p.pideRuta && p.botones.indexOf('ENTRADA') >= 0 && SUP.rutas.length ? '<label for="sRuta">Ruta</label><select id="sRuta"><option value="">Escoge…</option>' + SUP.rutas.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '<option>OTRA / APOYO</option></select>' : '';
  q('sBot').innerHTML = p ? p.botones.map(function (a) { return '<button class="btn ' + CLS[a] + '" data-a="' + a + '" style="margin-top:8px">' + ETQ[a] + ' de ' + esc(cap(p.nombre.split(' ')[0])) + '</button>'; }).join('') : '';
  Array.prototype.forEach.call(q('sBot').querySelectorAll('[data-a]'), function (b) {
    b.onclick = function () {
      if (!q('sMot').value) { q('sMsg').innerHTML = '<div class="alerta">Escoge el motivo.</div>'; return; }
      b.disabled = true; b.textContent = 'Registrando…';
      llamar('mk_marcarPorOtro', DEV, p.cedula, b.dataset.a, q('sHora').value, q('sMot').value, POS, q('sRuta') ? q('sRuta').value : '').then(function (r) {
        llamar('mk_listaPersonal', DEV).then(function (x) { SUP = x; pintarSup('<div class="aviso">' + esc(r.msg) + '</div>'); });
      }).catch(function (e) { b.disabled = false; b.textContent = ETQ[b.dataset.a]; q('sMsg').innerHTML = '<div class="alerta">' + esc(e.message) + '</div>'; });
    };
  });
}

document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && E && E.registrado && !E.confirmacion && !q('sPer') && !q('nEnviar') && !q('nListo')) cargar(); });
if (API.indexOf('/exec') < 0) $app.innerHTML = '<div class="alerta">Falta pegar el link de la app en la línea var API de este archivo.</div>'; else cargar();
</script>
